[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admire-cli"
version = "0.1.0"
description = "Unofficial command-line client for the Admire MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
admire = "admire_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
